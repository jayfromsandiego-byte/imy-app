<script>
/* ═════════════════ I Miss You Memorial · unified app shell ═════════════════ */
(function(){
'use strict';

/* ── pages ── */
function decodePage(id){
  var b64=document.getElementById(id).textContent.trim();
  var bin=atob(b64), bytes=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
var SRC={};
['landing','tribute','studio','dashboard','signin','checkout'].forEach(function(k){SRC[k]=decodePage('pg-'+k)});

/* ── state ── */
var MEMKEY='imy_prototype_v1';
var state=null, lsOK=true;
function blank(){return {account:null, memorials:[], activeId:null, draft:null, seq:1}}
function load(){
  try{ var raw=localStorage.getItem(MEMKEY); state=raw?JSON.parse(raw):blank(); }
  catch(e){ lsOK=false; state=blank(); }
  if(!state||typeof state!=='object')state=blank();
  state.memorials=state.memorials||[];
}
function stripMedia(obj){
  return JSON.parse(JSON.stringify(obj,function(k,v){
    if(typeof v==='string'&&v.indexOf('data:')===0&&v.length>60000)return '';
    return v;
  }));
}
var warnedQuota=false;
function save(){
  if(!lsOK)return;
  try{ localStorage.setItem(MEMKEY,JSON.stringify(state)); }
  catch(e){
    try{ localStorage.setItem(MEMKEY,JSON.stringify(stripMedia(state))); }catch(e2){ lsOK=false; }
    if(!warnedQuota){warnedQuota=true; toast('Large photos are kept for this visit — the full save arrives with the real app.');}
  }
}
load();

/* ── helpers ── */
function plusUnlocked(){ return state.memorials.some(function(m){return m.plan==='plus'}) }
function canCreate(){ return state.memorials.length===0 || plusUnlocked() }
function priceFor(targetId){
  var otherPlus=state.memorials.some(function(m){return m.plan==='plus'&&m.id!==targetId});
  return otherPlus?{amount:157.60,base:197,discount:20}:{amount:197,base:197,discount:0};
}

function render(){
  var r=parseRoute();
  var v=r.seg[0]||'';
  if(v==='seed'){ seed(false); return; }
  if(v==='seedplus'){ seed(true); return; }
  if(v===''){ mount('landing',SRC.landing,{anchor:r.q.anchor||''}); return; }
  if(v==='signin'){
    if(state.account){ afterSignin(r.q); return; }
    mount('signin',SRC.signin,{next:r.q.next||'',plan:r.q.plan||''});
    return;
  }
  if(v==='studio'){
    if(!state.account){ go('#/signin?next=studio'); return; }
    var mid=r.q.m||'new';
    var mem=mid==='new'?null:byId(mid);
    if(mid!=='new'&&!mem){ go('#/dashboard'); return; }
    if(mid==='new'&&!canCreate()){ startFlow(); return; }
    var draft=mem?mem.data:(state.draft||null);
    var price=priceFor(mem?mem.id:null);
    mount('studio',SRC.studio,{mode:mem?'edit':'new',m:mid,draft:draft,account:state.account,
      plan:mem?mem.plan:(r.q.plan==='plus'?'plus-intent':'free'),published:!!mem,
      slug:mem?(mem.customSlug||mem.slug):'',price:price,counts:mem?mem.counts:null,step:r.q.step||''});
    return;
  }
  if(v==='site'){
    var slug=r.seg[1]||'';
    if(slug==='eleanor'){ mount('tribute',SRC.tribute,{}); return; }
    var m=findBySlug(slug);
    if(!m){ toast('That page isn’t here yet.'); go('#/'); return; }
    var ov=composeOverride(m.data,{plan:m.plan,mode:'view',slug:m.customSlug||m.slug,account:state.account||{},counts:m.counts,privacy:m.privacy||'public',password:m.password||''});
    if(state.account)ov.ownerEdit={m:m.id};
    mount('tribute',spliceOverride(SRC.tribute,ov),{});
    return;
  }
  if(v==='dashboard'){
    if(!state.account){ go('#/signin?next=dashboard'); return; }
    var act=activeMem();
    if(!act){ startFlow(''); return; }
    mount('dashboard',spliceDesk(SRC.dashboard,composeDesk(act)),{});
    return;
  }
  if(v==='checkout'){
    var cm=byId(r.q.m||'');
    if(!cm){ go('#/dashboard'); return; }
    var pr=priceFor(cm.id);
    var fullSlug=String(cm.data.name||'').toLowerCase().replace(/[^a-z0-9]+/g,'').slice(0,40);
    mount('checkout',SRC.checkout,{
      m:cm.id, price:pr, name:cm.data.name||'', first:firstNameOf(cm.data.name)||'',
      pron:cm.data.pron||'they', post:r.q.post==='1', plan:cm.plan,
      liveUrl:location.origin+location.pathname+'#/site/'+(cm.customSlug||cm.slug),
      currentSlug:cm.customSlug||cm.slug, suggestSlug:fullSlug,
      taken:state.memorials.map(function(x){return x.customSlug||x.slug}).concat(['eleanor'])
    });
    return;
  }
  mount('landing',SRC.landing,{});
}
function afterSignin(q){
  var next=q.next||'';
  if(next==='start'){ startFlow(q.plan==='plus'?'plus':''); return; }
  if(next==='studio'){ startFlow(''); return; }
  if(next==='dashboard'||state.memorials.length){ go('#/dashboard'); return; }
  startFlow('');
}

/* ── messages from pages ── */
window.addEventListener('message',function(e){
  var m=e.data;
  if(!m||m.type!=='imy')return;
  if(!frame||e.source!==frame.contentWindow)return;   /* only direct children */
  var a=m.action, d=m.data||{};
  if(a==='ready'){ sendInit(); return; }
  if(a==='nav'){
    if(d.go==='landing'){ if(currentView==='landing'&&d.anchor){cmd('anchor',{anchor:d.anchor});}else{go('#/'+(d.anchor?'?anchor='+d.anchor:''));} return; }
    if(d.go==='start'){ startFlow(d.plan==='plus'?'plus':''); return; }
    if(d.go==='signin'){ state.account?go('#/dashboard'):go('#/signin'); return; }
    if(d.go==='dashboard'){ go('#/dashboard'); return; }
    if(d.go==='site'){ go('#/site/'+(d.slug||'eleanor')); return; }
    if(d.go==='studio'){ go('#/studio?m='+(d.m||'new')+(d.step?'&step='+d.step:'')); return; }
    if(d.go==='checkout'){ go('#/checkout?m='+d.m); return; }
    return;
  }
  if(a==='signin'){
    state.account={name:(d.name||'').trim(),email:(d.email||'').trim(),method:d.method||'email'};
    save();
    toast('Signed in as <b>'+esc(firstNameOf(state.account.name)||state.account.email)+'</b>');
    afterSignin(parseRoute().q);
    return;
  }
  if(a==='signout'){ state.account=null; save(); try{if(typeof sb!=='undefined'&&sb)sb.auth.signOut({scope:'local'});}catch(e){} toast('Signed out. Everything stays, safe.'); go('#/'); return; }
  if(a==='draft'){
    var r=parseRoute();
    if(r.q.m&&r.q.m!=='new'){ var mm=byId(r.q.m); if(mm){ mm.data=d.draft; } }
    else state.draft=d.draft;
    save();
    return;
  }
  if(a==='compose'){
    var ov=composeOverride(d.draft,{plan:d.plan||'free',mode:'edit',slug:d.slug||'',account:state.account||{},counts:d.counts});
    cmd('preview',{src:spliceOverride(SRC.tribute,ov)});
    return;
  }
  if(a==='publish'){
    var r2=parseRoute();
    var target=null;
    if(r2.q.m&&r2.q.m!=='new')target=byId(r2.q.m);
    if(target){
      target.data=d.draft; save();
      if(d.plan==='plus'&&target.plan!=='plus'){ go('#/checkout?m='+target.id); return; }
      toast('Saved. '+esc(firstNameOf(d.draft.name)||'The page')+'’s page is up to date.');
      go('#/dashboard'); return;
    }
    var id='m'+(state.seq++);
    var mem={id:id,slug:randSlug(),customSlug:'',plan:'free',data:d.draft,createdAt:Date.now(),counts:{visits:1}};
    state.memorials.push(mem); state.activeId=id; state.draft=null; save();
    if(d.plan==='plus'){ go('#/checkout?m='+id); return; }
    toast('Published — the page is live.');
    go('#/checkout?m='+id+'&post=1');
    return;
  }
  if(a==='pay'){
    var pm=byId(d.m); if(!pm)return;
    pm.plan='plus';
    if(d.slug){
      var want=String(d.slug).toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);
      var clash=want==='eleanor'||state.memorials.some(function(x){return x.id!==pm.id&&(x.customSlug===want||x.slug===want)});
      if(want&&!clash)pm.customSlug=want;
    }
    state.activeId=pm.id; save();
    toast('Plus is yours, for life — <b>imissyoumemorial.com/'+(pm.customSlug||pm.slug)+'</b>');
    go('#/site/'+(pm.customSlug||pm.slug));
    return;
  }
  if(a==='updatePerson'){
    var um=byId(d.m); if(!um)return;
    var ud=um.data;
    if((d.name||'').trim())ud.name=d.name.trim();
    function fromIso(s){ var m2=String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})$/); return m2?{y:m2[1],m:String(+m2[2]),d:String(+m2[3])}:null; }
    var bb=fromIso(d.born); if(bb){ud.by=bb.y;ud.bm=bb.m;ud.bd=bb.d;}
    var dd2=fromIso(d.died); if(dd2){ud.dy=dd2.y;ud.dm=dd2.m;ud.dd=dd2.d;}
    if(d.pron)ud.pron=d.pron;
    if(d.portrait)ud.portrait=d.portrait;
    if(d.background)ud.coverbg=d.background;
    save();
    toast('Saved — '+esc(firstNameOf(ud.name)||'the page')+'’s page updates.');
    render();
    return;
  }
  if(a==='deleteAccount'){
    state=blank(); save();
    toast('The account is deleted. In production, anything a family published rests — it is never lost.');
    go('#/'); return;
  }
  if(a==='transferOwner'){
    var tm=byId(d.m); if(!tm)return;
    tm.owner=String(d.email||'').trim(); save();
    var who=firstNameOf(tm.data.name);
    toast('<b>'+esc(tm.owner)+'</b> now holds '+(who?esc(who)+'’s page':'the page')+' — in production, the keys arrive by email.');
    render(); return;
  }
  if(a==='stripePay'){
    var sm=byId(d.m); if(!sm)return;
    var LIVE=/(^|\.)imissyoumemorial\.com$/.test(location.hostname);
    if(!LIVE){
      /* off the real domain there is no Stripe — the old simulated grant */
      sm.plan='plus';
      if(d.slug){ var want2=String(d.slug).toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,40);
        var clash2=want2==='eleanor'||state.memorials.some(function(x){return x.id!==sm.id&&(x.customSlug===want2||x.slug===want2)});
        if(want2&&!clash2)sm.customSlug=want2; }
      state.activeId=sm.id; save();
      toast('Plus granted (simulated here — the live site charges through Stripe).');
      go('#/site/'+(sm.customSlug||sm.slug)); return;
    }
    try{ localStorage.setItem('imy_pay_pending',JSON.stringify({m:sm.id,slug:d.slug||''})); }catch(e){}
    fetch('/api/stripe/checkout',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({plan:'plus_once',tributeId:'proto-'+sm.id,slug:sm.slug,
        email:(state.account||{}).email||'',returnTo:'/preview/unified.html?m='+sm.id})})
      .then(function(r){return r.json()})
      .then(function(j){ if(j&&j.ok&&j.url)location.assign(j.url); else toast('The checkout door didn’t open — try again in a moment.'); })
      .catch(function(){ toast('The checkout door didn’t open — try again in a moment.'); });
    return;
  }
  if(a==='keepFree'){ var kf=byId(d.m); if(kf){ state.activeId=kf.id; save(); go('#/site/'+(kf.customSlug||kf.slug)); } return; }
  if(a==='setPrivacy'){
    var pm2=byId(d.m); if(!pm2)return;
    pm2.privacy=d.privacy||'public';
    if(d.privacy==='password')pm2.password=String(d.password||'');
    save();
    return;
  }
  if(a==='setActive'){ state.activeId=d.m; save(); render(); return; }
  if(a==='createNew'){ startFlow(d.plan==='plus'?'plus':''); return; }
  if(a==='toast'){ toast(esc(d.msg||'')); return; }
});

function cleanAuthParams(){
  try{
    var u=new URL(location.href);
    ['code','state','error','error_code','error_description'].forEach(function(k){u.searchParams.delete(k)});
    history.replaceState(null,'',u.pathname+(u.searchParams.toString()?'?'+u.searchParams.toString():'')+u.hash);
  }catch(e){}
}
function consumeNextIntent(){
  var q={};
  try{ q=JSON.parse(localStorage.getItem('imy_oauth_next')||'{}'); localStorage.removeItem('imy_oauth_next'); }catch(e){}
  afterSignin(q||{});

(function(){
  var qs;
  try{ qs=new URLSearchParams(location.search); }catch(e){ return; }
  /* home from Stripe · the webhook hears it too, this marks the prototype's copy */

  var authErr=qs.get('error_description')||qs.get('error');

    return;
  }
  /* a quiet welcome back · a Google session from a past visit, adopted once */

    });
  }
})();
